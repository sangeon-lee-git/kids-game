<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#191632" />
    <title>정원이와 도겸이의 별빛 놀이공원</title>
    <link rel="stylesheet" href="shared/park.css?v=park-blend1" />
    <link rel="preload" as="image" href="shared/art/park-panorama-clearing.png" />
    <script defer src="shared/voice/sohee/lines.js?v=voices3"></script>
    <script src="shared/characters/catalog.js?v=3d1" defer></script>
    <script src="shared/park.js?v=voices3" defer></script>
    <script src="shared/lobby.js?v=animated-park2" defer></script>
  </head>
  <body>
    <div class="park-frame">
      <header class="park-bar">
        <a class="brand" href="./index.html" aria-label="별빛 놀이공원 처음으로"
          ><span class="brand-star" aria-hidden="true">★</span> 별빛 놀이공원</a
        >
        <div class="bar-actions">
          <span
            id="badgeCount"
            class="badge-count"
            title="완료한 놀이 수"
          ></span
          ><button class="sound" id="voiceOpen" type="button">목소리</button
          ><button class="sound" id="sound" type="button"></button>
        </div>
      </header>
      <main id="lobby">
        <section class="panorama" aria-labelledby="parkTitle">
          <svg class="park-scene" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">
            <defs><clipPath id="carousel-opening"><rect x="1315" y="586" width="290" height="135"/></clipPath></defs>
            <g class="park-sparkles" fill="#fff0a8">
              <circle cx="885" cy="55" r="3"/><circle cx="1088" cy="42" r="3"/>
              <circle cx="1019" cy="656" r="3"/><circle cx="1575" cy="864" r="3"/>
            </g>
            <g class="park-ground-shadows" fill="#142940">
              <ellipse cx="1198" cy="690" rx="183" ry="27" opacity=".34"/>
              <ellipse cx="1457" cy="792" rx="147" ry="19" opacity=".35"/>
            </g>
            <g class="wheel-ride">
              <image href="shared/art/ferris-support.png" x="1020" y="294" width="360" height="390" preserveAspectRatio="none"/>
              <g class="ferris-rotor">
                <image href="shared/art/ferris-rotor.png" x="952" y="72" width="496" height="496"/>
                <g class="ferris-glimmer" fill="#fff6c8">
                  <circle cx="1200" cy="95" r="7"/><circle cx="1359" cy="161" r="7"/>
                  <circle cx="1425" cy="320" r="7"/><circle cx="1359" cy="479" r="7"/>
                  <circle cx="1200" cy="545" r="7"/><circle cx="1041" cy="479" r="7"/>
                  <circle cx="975" cy="320" r="7"/><circle cx="1041" cy="161" r="7"/>
                </g>
                <g transform="translate(1200 95)"><g class="ferris-cabin"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
                <g transform="translate(1359 161)"><g class="ferris-cabin cabin-teal"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
                <g transform="translate(1425 320)"><g class="ferris-cabin"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
                <g transform="translate(1359 479)"><g class="ferris-cabin cabin-teal"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
                <g transform="translate(1200 545)"><g class="ferris-cabin cabin-amber"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
                <g transform="translate(1041 479)"><g class="ferris-cabin"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
                <g transform="translate(975 320)"><g class="ferris-cabin cabin-teal"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
                <g transform="translate(1041 161)"><g class="ferris-cabin cabin-amber"><image href="shared/art/ferris-cabin.png" x="-48" y="-18" width="96" height="115"/></g></g>
              </g>
            </g>
            <g class="carousel-ride">
              <g class="carousel-horses">
                <g class="carousel-horse-back" style="--phase: 0s"><g class="carousel-horse" transform="translate(1380 666)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
                <g class="carousel-horse-back" style="--phase: -2.4s"><g class="carousel-horse" transform="translate(1460 636)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
                <g class="carousel-horse-back" style="--phase: -4.8s"><g class="carousel-horse" transform="translate(1540 666)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
                <g class="carousel-horse-back" style="--phase: -7.2s"><g class="carousel-horse" transform="translate(1460 708)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
              </g>
              <image class="carousel-shell" href="shared/art/carousel-shell.png" x="1245" y="394" width="425" height="420" preserveAspectRatio="none"/>
              <g class="carousel-front-horses" clip-path="url(#carousel-opening)">
                <g class="carousel-horse-front" style="--phase: 0s"><g class="carousel-horse" transform="translate(1380 666)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
                <g class="carousel-horse-front" style="--phase: -2.4s"><g class="carousel-horse" transform="translate(1460 636)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
                <g class="carousel-horse-front" style="--phase: -4.8s"><g class="carousel-horse" transform="translate(1540 666)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
                <g class="carousel-horse-front" style="--phase: -7.2s"><g class="carousel-horse" transform="translate(1460 708)"><image href="shared/art/carousel-horse.png" x="-65" y="-65" width="130" height="100"/></g></g>
              </g>
              <g class="carousel-glimmer" fill="#fff3b2">
                <circle cx="1340" cy="579" r="5"/><circle cx="1457" cy="586" r="5"/><circle cx="1572" cy="579" r="5"/>
              </g>
            </g>
          </svg>
          <div class="title-block">
            <p class="family">
              <span aria-hidden="true">✦</span> 정원이와 도겸이의
            </p>
            <h1 id="parkTitle"><span>별빛</span><br />놀이공원</h1>
          </div>
          <div class="signature" id="signature" aria-hidden="true">
            아빠's make <i>✦</i>
          </div>
        </section>
        <section class="arcade" aria-labelledby="lobbyTitle">
          <div class="section-head"><h2 id="lobbyTitle">놀이 고르기</h2></div>
          <nav class="areas" id="areas" aria-label="놀이 구역"></nav>
          <div class="tickets" id="tickets" aria-live="polite"></div>
        </section>
      </main>
      <main class="character-screen" id="characterScreen" hidden>
        <div class="choose-wrap">
          <button class="back" id="back" type="button">‹ 놀이 고르기</button>
          <p class="selected-game" id="chosenGame"></p>
          <h1 id="chooseTitle" tabindex="-1">누구와 함께 놀까?</h1>
          <div class="heroes" id="heroes"></div>
        </div>
      </main>
    </div>
    <dialog id="voiceDialog" aria-labelledby="voiceTitle">
      <h2 id="voiceTitle">안내 목소리</h2>
      <label for="voiceList">누구의 목소리로 놀까요?</label>
      <select id="voiceList">
        <option value="sohee">소희 · 밝은 목소리</option>
        <option value="vivian">Vivian · 경쾌한 목소리</option>
        <option value="device">기기 한국어 음성</option>
      </select>
      <button class="back" id="voiceListen" type="button">♫ 미리 듣기</button>
      <div class="voice-actions">
        <button class="back" id="voiceClose" type="button">닫기</button
        ><button class="hero-start" id="voiceSave" type="button">
          이 목소리로 놀기
        </button>
      </div>
    </dialog>
    <noscript
      >게임을 실행하려면 브라우저에서 자바스크립트를 켜 주세요.</noscript
    >
  </body>
</html>
